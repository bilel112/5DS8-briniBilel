services:
  mysqldb:
    image: mysql:8.0
    container_name: mysqldb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: test_db
    volumes:
      - mysql-data:/var/lib/mysql
    networks: [devops-net]

  backend:
    image: bilelbrini_5ds8_gestionprojets-backend:1.0.0
    container_name: backend
    restart: unless-stopped
    depends_on: [mysqldb]
    ports: ["8083:8080"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysqldb:3306/test_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    networks: [devops-net]

  frontend:
    image: bilelbrini_5ds8_gestionprojets-frontend:1.0.0
    container_name: frontend
    restart: unless-stopped
    depends_on: [backend]
    ports: ["4200:80"]
    networks: [devops-net]

volumes:
  mysql-data:

networks:
  devops-net:
